<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章加载中… · 谷瑞的博客</title>
  <link rel="stylesheet" href="styles/main.css">

  <!-- highlight.js：代码高亮样式（GitHub 风格） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo">谷瑞的博客</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </nav>
  </header>

  <main class="post-layout">

    <!-- 左侧：目录导航（桌面端显示） -->
    <aside class="toc-sidebar">
      <div class="toc-sticky">
        <p class="toc-title">目录</p>
        <nav id="toc" class="toc-nav">
          <!-- JavaScript 自动生成 -->
        </nav>
      </div>
    </aside>

    <!-- 中间：文章正文 -->
    <article class="post-body">
      <!-- 文章元信息（日期、标签） -->
      <div id="post-meta" class="post-page-meta"></div>

      <!-- Markdown 渲染后的 HTML 内容注入到这里 -->
      <div id="post-content" class="prose">
        <div class="loading-state">正在加载文章…</div>
      </div>
    </article>

  </main>

  <footer class="site-footer">
    <p>© 2026 谷瑞 · 用 ❤️ 制作</p>
  </footer>

  <!-- marked.js：Markdown 解析库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- highlight.js：代码高亮 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- 我们自己写的文章加载逻辑 -->
  <script src="js/post.js"></script>

</body>
</html>

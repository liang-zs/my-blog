<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谷瑞的博客</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="site-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo">谷瑞的博客</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </nav>
  </header>

  <!-- 主体内容 -->
  <main class="main-content">

    <!-- 个人简介区块 -->
    <section class="hero">
      <div class="hero-avatar">
        <!-- 临时用首字母做头像，之后可换成真实照片 -->
        <div class="avatar-placeholder">谷</div>
      </div>
      <h1 class="hero-name">谷瑞</h1>
      <p class="hero-bio">
        你好，我是一名探知者。我喜欢探索未知的领域，在这里我记录我的思考与探索。
      </p>
      <!-- 社交媒体链接 -->
      <div class="social-links">
        <a href="https://github.com/liang-zs" class="social-link">GitHub</a>
        <a href="#" class="social-link">邮件</a>
      </div>
    </section>

    <!-- 文章列表区块 -->
    <section class="posts-section">
      <h2 class="section-title">最新文章</h2>
      <div class="post-list">

        <article class="post-card">
          <div class="post-meta">
            <time>2026-05-19</time>
            <span class="post-tag">随笔</span>
          </div>
          <h3 class="post-title">
            <a href="post.html?post=hello-world">第一篇文章：你好，世界</a>
          </h3>
          <p class="post-excerpt">这是我博客的第一篇文章，记录我开始探索与写作的原因……</p>
        </article>

        <article class="post-card">
          <div class="post-meta">
            <time>2026-05-19</time>
            <span class="post-tag">技术</span>
          </div>
          <h3 class="post-title">
            <a href="post.html?post=build-a-blog">我是如何搭建这个博客的</a>
          </h3>
          <p class="post-excerpt">从零开始，用纯 HTML、CSS 和 JavaScript 搭建一个支持 Markdown 的个人博客……</p>
        </article>

      </div>
    </section>

  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p>© 2026 谷瑞 · 用 ❤️ 制作</p>
  </footer>

</body>
</html>
